services:
  # hbbs = ID / Rendezvous server (registro de IDs, heartbeat, NAT hole-punching)
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    # -r le dice a los clientes a qué host pedir relay. DEBE ser el dominio/IP pública.
    command: hbbs -r ${RUSTDESK_RELAY_HOST}:21117
    environment:
      TZ: ${TZ:-America/Mexico_City}
      # Exige clave para conectar. Sin esto, hbbr acepta a CUALQUIERA (ver README §9).
      # ⚠️ Los clientes ya desplegados sin Key dejarán de conectar hasta ponérsela.
      ENCRYPTED_ONLY: "1"
    ports:
      - "21115:21115"        # NAT type test (TCP)
      - "21116:21116"        # ID registration / heartbeat (TCP)
      - "21116:21116/udp"    # hole punching (UDP)  <-- imprescindible
      # 21118 NO se publica al host: Traefik llega por la red interna y lo
      # sirve como wss en /ws/id. Publicarlo solo lo expone en claro, y hbbs
      # se fia sin validar de X-Real-IP / X-Forwarded-For en los websockets,
      # asi que quien lo alcance directo puede falsear la IP de origen.
      # Ojo: un "ufw deny" NO bastaria, Docker inserta reglas que lo saltan.
    volumes:
      - rustdesk-data:/root  # par de claves id_ed25519 + db_v2.sqlite3
    restart: unless-stopped
    depends_on:
      - hbbr

  # hbbr = Relay server (reenvía el tráfico cuando la conexión directa P2P falla)
  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    environment:
      TZ: ${TZ:-America/Mexico_City}
      # Imprescindible aquí: hbbr deja KEY vacío por defecto = relay abierto al mundo.
      ENCRYPTED_ONLY: "1"
    ports:
      - "21117:21117"        # relay (TCP)
      # 21119 tampoco se publica: Traefik lo sirve como wss en /ws/relay.
    volumes:
      - rustdesk-data:/root  # comparte la MISMA clave que hbbs
    restart: unless-stopped

  # rustdesk-api = API Server + panel de admin web (proyecto comunitario, open source)
  # Panel en https://${RUSTDESK_API_HOST}/_admin/
  # Este SÍ es HTTP: en Coolify se le asigna dominio y Traefik le pone TLS.
  rustdesk-api:
    image: lejianwen/rustdesk-api:latest
    container_name: rustdesk-api
    expose:
      - "21114"              # HTTP. No se publica al host: entra por Traefik.
    environment:
      TZ: ${TZ:-America/Mexico_City}
      RUSTDESK_API_LANG: ${RUSTDESK_API_LANG:-en}
      # Lo que el panel le dirá a los clientes que configuren:
      RUSTDESK_API_RUSTDESK_ID_SERVER: ${RUSTDESK_RELAY_HOST}:21116
      RUSTDESK_API_RUSTDESK_RELAY_SERVER: ${RUSTDESK_RELAY_HOST}:21117
      RUSTDESK_API_RUSTDESK_API_SERVER: https://${RUSTDESK_API_HOST}
      # Clave pública de hbbs (id_ed25519.pub). Ver README §5.
      RUSTDESK_API_RUSTDESK_KEY: ${RUSTDESK_KEY}
      # Websocket del cliente web. El cliente le añade /ws/id y /ws/relay,
      # que Traefik enruta a hbbs:21118 y hbbr:21119.
      RUSTDESK_API_RUSTDESK_WS_HOST: ${RUSTDESK_WS_HOST}
      # ── Seguridad ────────────────────────────────────────────────────────────
      # Si JWT_KEY queda vacía, el JWT NO se activa. Es obligatoria.
      RUSTDESK_API_JWT_KEY: ${RUSTDESK_API_JWT_KEY}
      RUSTDESK_API_JWT_EXPIRE_DURATION: "24h"
      # Captcha tras N intentos fallidos (-1 desactiva, 0 siempre).
      RUSTDESK_API_APP_CAPTCHA_THRESHOLD: "3"
      # Ban por IP tras N intentos. El default del proyecto es 0 = DESACTIVADO.
      RUSTDESK_API_APP_BAN_THRESHOLD: "5"
    # El panel enlaza el boton "Web Client" a /webclient2, pero la imagen v2.7
    # no incluye resources/web2 (es un preview que nunca se publico). Copiamos
    # el cliente v1, que si viene, para que la ruta deje de dar 404.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -d resources/web2 ] && [ -d resources/web ]; then
          cp -r resources/web resources/web2
          echo "web2 creado a partir del cliente web v1"
        fi
        exec ./apimain
    volumes:
      - rustdesk-api-data:/app/data   # sqlite del panel: usuarios, libreta, logs
    restart: unless-stopped
    depends_on:
      - hbbs

volumes:
  rustdesk-data:
  rustdesk-api-data:
